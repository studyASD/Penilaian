<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rekap Nilai Tes Mapel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        <!-- Login / Authentication State Container -->
        <div id="login-container" class="flex-1 flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 mb-2">Rekap Nilai Tes Mapel</h1>
                <p class="text-slate-500 mb-6 text-sm">Silakan masuk menggunakan akun Google Anda untuk melanjutkan.</p>
                
                <!-- Tombol Login dengan Redirect agar aman dari Popup Blocked -->
                <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-medium py-3 px-4 rounded-xl border border-slate-300 shadow-sm transition-all duration-200 active:scale-[0.98]">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google logo">
                    <span>Masuk dengan Google</span>
                </button>
            </div>
        </div>

        <!-- Dashboard Container (Hidden by default until logged in) -->
        <div id="dashboard-container" class="hidden flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold">
                        <i class="fa-solid fa-school"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800">Dashboard Guru</h2>
                        <p class="text-xs text-slate-500" id="user-email">Memuat...</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="text-sm bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-4 py-2 rounded-xl transition-all">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Rekap Nilai Terbaru</h3>
                    <p class="text-slate-500 text-sm">Sistem login berhasil diperbarui menggunakan Redirect agar terhindar dari error Popup Blocked.</p>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase (Ganti dengan konfigurasi milik Anda jika diperlukan)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplate-Example",
            authDomain: "rekap-nilai-mapel.firebaseapp.com",
            projectId: "rekap-nilai-mapel",
            storageBucket: "rekap-nilai-mapel.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Fungsi pemicu login menggunakan Redirect (Aman dari popup blocked)
        window.handleGoogleLogin = function() {
            signInWithRedirect(auth, provider);
        };

        // Fungsi Logout
        window.handleLogout = function() {
            signOut(auth).then(() => {
                console.log("Berhasil keluar");
            });
        };

        // Cek hasil redirect setelah halaman dimuat kembali oleh Google
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    console.log("Login sukses via redirect:", result.user);
                }
            })
            .catch((error) => {
                console.error("Error login redirect:", error.message);
            });

        // Pantau status login pengguna secara real-time
        onAuthStateChanged(auth, (user) => {
            const loginContainer = document.getElementById('login-container');
            const dashboardContainer = document.getElementById('dashboard-container');
            const userEmail = document.getElementById('user-email');

            if (user) {
                loginContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userEmail.textContent = user.email;
            } else {
                loginContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
